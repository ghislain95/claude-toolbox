# sdd:note: generated only with the `ci` option.
# Agent tooling guard.
#
# git-guardrail    - .claude/hooks/block-git-writes.sh is the only thing keeping agents from
#                    committing on or pushing a protected branch (when the remote has no server-side
#                    branch protection). Its regression suite runs on every change to it.
# merge-conditions - .sdd/bin/merge_conditions.py decides which gates a pull request opens and
#                    .sdd/bin/deploy-guard.sh which commits deploy; their tests, and the validity of
#                    .sdd/triggers.yaml and .sdd/deployment.yaml, are checked on every change to .sdd/.
name: Tooling

on:
  pull_request:
    paths: [ '.claude/hooks/**', '.sdd/**', '.github/workflows/tooling.yml' ]
  push:
    branches: [ '{{DEFAULT_BRANCH}}' ]
    paths: [ '.claude/hooks/**', '.sdd/**', '.github/workflows/tooling.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  git-guardrail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Git guardrail regression tests
        run: bash .claude/hooks/block-git-writes.test.sh

  merge-conditions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Matcher and deploy guard tests, triggers and deployment profile
        run: |
          python3 .sdd/bin/test_merge_conditions.py
          python3 .sdd/bin/merge_conditions.py validate .sdd/triggers.yaml .sdd/deployment.yaml
